# Bootstrap closure only (BRIEF-12 §3.1): core, sdk, vfs, host (+ dev-only testkit)
# and the single leaf app modkit-cli. No ui/runtime/lsp/xml — not even as stubs.
packages:
  - 'packages/*'
  - 'apps/*'
# esbuild works through its platform binary package (@esbuild/win32-x64); its postinstall
# script is only a fallback/validator, so build scripts stay denied (pnpm default-secure).
allowBuilds:
  esbuild: false
