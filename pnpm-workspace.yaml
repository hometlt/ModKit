# The production bootstrap dependency closure remains core, sdk, vfs and host. Workspace membership
# is intentionally broader so optional packages and reference extensions can run conformance and
# pack tests; none of the entries below becomes a bootstrap dependency merely by being
# workspace-linked.
packages:
  - 'packages/core'
  - 'packages/sdk'
  - 'packages/vfs'
  - 'packages/host'
  - 'packages/extension-manager'
  - 'packages/codec-kit'
  - 'packages/code'
  - 'packages/scene'
  - 'packages/uv'
  - 'packages/ui'
  - 'packages/testkit'
  - 'apps/*'
  # Optional reference extensions are workspace-linked for conformance tests only. They are not
  # dependencies of core/sdk/vfs/host and therefore do not enter the bootstrap import closure.
  - 'extensions/archives'
  - 'extensions/audio'
  - 'extensions/images'
  - 'extensions/vector'
  - 'extensions/models'
  - 'extensions/video'
  - 'extensions/data'
  - 'extensions/documents'
  - 'extensions/translation'
  - 'extensions/lua'
  - 'examples/extensions/counter-runtime'
  - 'examples/extensions/software-renderer'
# esbuild works through its platform binary package (@esbuild/win32-x64); its postinstall is only a
# fallback/validator. Electron's package, in contrast, uses its install script to download the
# version-pinned application binary required by the real desktop debug profile.
allowBuilds:
  esbuild: false
  electron: true
  # The local VSIX flow packages unsigned artifacts; neither signing helper is allowed to run.
  '@vscode/vsce-sign': false
  keytar: false
