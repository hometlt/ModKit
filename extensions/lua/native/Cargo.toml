[package]
name = "modkit-lua-syntax"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# full_moon 2.2.0 does not compile with default-features = false unless "serde" is enabled.
full_moon = { version = "=2.2.0", default-features = false, features = ["luau", "lua52", "lua53", "lua54", "luajit", "cfxlua", "serde"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
