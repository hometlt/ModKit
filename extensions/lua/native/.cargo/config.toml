[target.wasm32-unknown-unknown]
# 16 MiB (the commonly-suggested value) was not enough for 2000 levels of nested parentheses:
# both full-moon's recursive-descent parser and this crate's own recursive JSON writer (a
# closure per nested field, which LLVM does not always collapse away, especially under
# opt-level = "s") add up to more than one frame's worth of stack per nesting level. 64 MiB is
# cheap (reserved address space, not committed memory) and covers it with headroom.
rustflags = ["-C", "link-arg=-zstack-size=67108864"]
