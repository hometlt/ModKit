      - 'block9/casc-mpq-texture-chain'
      - 'format/big/open-inspect'
      - 'format/casc/open-inspect'
portableProfileSemantics:
  UVD: 'definitions, не документы: UVD никогда не маршрутизируется через document-контракты'
  UVP: 'data-only package: пакет данных не исполняется, поэтому plane с профилем UVP не может объявлять execute'
  UVE: 'executable extension: профиль UVE допустим только при явно названном trust profile пакета'
  UVM: 'модельный interchange: живая проекция и материализация — разные состояния'
  UVW: 'нейтральный мир'
  UVT: 'текстурный профиль'
  UVI: 'интерфейсный профиль'
  none: 'честное состояние: plane не имеет portable-профиля и это не блокирует общий viewer'
