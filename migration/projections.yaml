schemaVersion: 'projection-matrix-1'
$comment: 'Projection/composition matrix (PLAN_MODKIT_MK3_FINAL_RU.md блок 10 работа 10). Одна строка — один plane переноса: чем он является в MK3, какой контракт его публикует, какие facets обязательны, какой portable profile для него честен, насколько зрелым является артефакт, что считается производной презентацией, какое доверие имеет пакет, какая известна потеря и что с этим planeом делают. Колонка action — единственное разрешённое действие по умолчанию; secondaryActions перечисляют доказанные или запланированные дополнительные маршруты. Проверяется scripts/migration/check-registry.mjs.'
actionVocabulary:
  - 'defer'
  - 'edit'
  - 'execute'
  - 'export-native'
  - 'materialize'
  - 'preserve-opaque'
  - 'project-live'
  - 'retain'
invariants:
  - id: 'uvd-is-not-a-document'
    rule: 'Plane definition имеет portableProfile UVD и никогда не маршрутизируется через document-контракты; document-plane не может объявлять portableProfile UVD.'
    enforcedBy: 'scripts/migration/check-registry.mjs'
  - id: 'archive-is-not-a-package'
    rule: 'Plane container объявляет packageTrust generic-archive-is-untrusted-data-never-a-package: generic archive не превращается в UVP или UVE без явной package-operation и trust profile, а browse никогда не выводит pack/repack.'
    enforcedBy: 'scripts/migration/check-registry.mjs'
  - id: 'candidate-facet-is-not-admitted'
    rule: 'Facet, объявленный facetMaturity publisher-candidate, обязан быть optional и не может стоять в requiredFacets: контракт, доказанный одной publisher-семьёй, не становится обязательным для plane (ADR-DOC-001, гейт §2.7).'
    enforcedBy: 'scripts/migration/check-registry.mjs'
  - id: 'derived-presentation-is-not-a-source'
    rule: 'Layout tree, растрированная страница, thumbnail и render являются derived presentation и не создают новый source document.'
    enforcedBy: 'scripts/migration/check-registry.mjs'
  - id: 'reader-does-not-imply-writer'
    rule: 'artifactMaturity reader-only запрещает action edit, materialize и export-native как primary action: наличие reader не доказывает writer, обратимость или cross-format export.'
    enforcedBy: 'scripts/migration/check-registry.mjs'
  - id: 'uvp-is-data-only'
    rule: 'Plane с portableProfile UVP не может объявлять execute ни основным, ни вторичным действием, и обязан назвать trust profile пакета: UVP — пакет данных, а не исполняемое расширение.'
    enforcedBy: 'scripts/migration/check-registry.mjs'
  - id: 'uve-requires-trust-profile'
    rule: 'Plane с portableProfile UVE обязан назвать trust profile пакета: executable extension без профиля доверия не существует.'
    enforcedBy: 'scripts/migration/check-registry.mjs'
  - id: 'portable-profile-none-is-honest'
    rule: 'portableProfile none — допустимое честное состояние: plane обязан всё равно объявить контракт и действие, отличное от defer, чтобы отсутствие portable-профиля не блокировало общий viewer.'
    enforcedBy: 'scripts/migration/check-registry.mjs'
counts:
  planes: 8
planes:
