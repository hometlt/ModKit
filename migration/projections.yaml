      - 'nodes'
      - 'geometry'
      - 'bounds'
    optionalFacets:
      - 'animation'
      - 'collision'
      - 'lod'
      - 'materials'
      - 'skeleton'
      - 'sockets'
      - 'texture-refs'
      - 'variants'
    facetMaturity:
      animation: 'admitted'
      collision: 'admitted'
      materials: 'admitted'
      skeleton: 'admitted'
      texture-refs: 'admitted'
    portableProfile: 'UVM'
    artifactMaturity: 'reader-and-writer'
    derivedPresentation: 'rasterised-preview-and-thumbnail-are-derived-not-a-new-source'
    packageTrust: 'not-applicable'
    fidelity: 'partial'
    action: 'project-live'
    secondaryActions:
      - 'materialize'
      - 'export-native'
    plannedBlock: 11
    knownLoss:
      - 'materialization в UVM реализована слайсом 11C1 (common.uv/model-materializer@1 + export-only writer); MaterializationReceipt выпускается, byte-stability и три оракула доказаны'
      - 'ProjectionReceipt выпускают M3, W3D, W3X, VXL, OBJ и UVM (слайс 12-1); остальные модельные кодеки (DAE, glTF, PLY, STL, XBF, SCM) квитанцию пока не выпускают'
      - 'skeleton admitted после независимой семьи M3: MODL.bones → BONE.name → CHAR декодируется в blizzard/models и доказан на artifact1.m3 (12 именованных bindings); W3D/W3X остаются отдельной SAGE/Westwood семьёй'
      - 'родительские связи, flags и IREF rest pose M3 валидируются или честно помечаются lost в ProjectionReceipt, но model-skeleton-source@1 пока переносит только index/name bindings'
      - 'native export не заявлен ни одним кодеком; NativeExportReceipt отсутствует'
      - 'глубина по формату разная: M3/W3D/W3X доказаны на реальном корпусе, VXL — на реальном файле, остальные модели — только структурно'
    resourceDependencies:
      - 'текстуры и sidecar объявляются моделью как логические требования; открывает их host, не кодек'
      - 'post-open ResourceSessionPort блока 11C0 существует: у ссылки теперь типизированный исход с кодом и provenance, а не отсутствие'
      - 'межмодовый корень по-прежнему нерешаем без game-mount провайдера: artifact1.m3 даёт not-found, полный резолв — блоки 12/15'
    corpusEvidence:
      - 'MODKITX_SC2_ROOT'
      - 'MODKITX_W3D_PATH'
      - 'MODKITX_W3X_PATH'
      - 'MODKITX_VXL_PATH'
    capabilityIds:
