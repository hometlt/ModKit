      - 'writer не объявлен: preserving repack и round-trip не доказаны, поэтому сохранность неизвестных записей пакета и XML-узлов при правке не заявляется'
      - 'ZIP64, multi-disk, шифрование и методы сжатия кроме stored и deflate отвергаются, а не читаются частично'
