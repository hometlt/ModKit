schemaVersion: 'capability-registry-1'
$comment: 'Semantic capability registry (слой 2, PLAN_MODKIT_MK3_FINAL_RU.md §3.3, блок 10 работы 4–6 и 11). Строка — пользовательская возможность, не поверхность кода; несколько технических строк могут реализовывать одну возможность. Гибрид: скелет выведен из migration/generated/source-inventory.json, scripts/mk2-port-ratchet.json, scripts/parity/common-coverage.json, reports/parity/latest.json и extensions/*/*/MIGRATION-NOTES*.json; семантические поля — данные. scripts/migration/check-registry.mjs заново выводит каждый машинный факт и сверяет, поэтому рукописное значение не может разойтись с деревом. Канонический порядок ключей и сортировка строк по capabilityId обязательны.'
ownerAdditionsFrozen: true
ownerAdditionsFrozenOn: '2026-08-28'
ownerAdditionsFrozenNote: "Обязательный набор owner additions заморожен реестром блока 10 и уточнён решениями владельца для первого Product GA: ODG, семь MK3-native text-data форматов, machine-readable closure приложений и RC блока 20, явная политика подписи MPQ, а также knowledge packs, карточки, граф, расчёты, шаблоны, общий языковой анализ, read-only MCP и три inspection skill для общего Modkit, SC2 и Warzone. C&C 3, Kane's Wrath, Red Alert 3, Spring, Recoil и BAR не входят в этот closure и остаются после Multiverse STOP. Новая экспериментальная идея получает experimental-optional и не расширяет Legacy Migration Complete; смена obligation требует решения владельца и обновления scope lock."
evidenceLegend:
  E0: 'Строка обнаружена; исполняемого MK3-контракта ещё нет (planned owner может быть уже назван).'
  E1: 'Contract/manifest существует и валидируется.'
  E2: 'Synthetic positive/negative tests проходят.'
  E3: 'Реальный corpus декодируется/изменяется с provenance.'
  E4: 'Differential result против опечатанного legacy oracle не беднее.'
  E5: 'Именованный живой app workflow проходит на целевом host.'
scopeLock:
  focused-required-addition:
    - 'ODG'
    - 'MK3-native text-data (TSV/INI/JSON/JSONC/TOML/XML/YAML)'
    - 'Block 20 application and RC closure'
    - 'Blizzard MPQ native signature policy'
    - 'Product GA knowledge packs, subject cards, relation graph and calculations for SC2 and Warzone'
    - 'Product GA game templates and protocol-neutral language analysis'
    - 'Product GA read-only Modkit MCP and three inspection skills'
  post-ga-required-proof:
    - 'SC1 CHK'
    - 'SC1 GRP'
    - 'RA2 map'
    - 'RA2/TS SHP'
    - 'Authenticode signing'
    - 'packaged installers'
    - 'public PWA deployment'
  legacy-required:
    - 'legacy VXL parity (HVA/PAL/VPL depth)'
  experimental-optional:
    - 'volume-grid-3d'
    - 'free-space-3d'
counts:
  capabilities: 331
  unmappedRules: 13
  unmappedUnits: 608
  mappedUnits: 512
  inventoryUnits: 1120
