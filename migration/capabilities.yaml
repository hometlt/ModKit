  - selector: 'package-export'
    count: 133
    reason: 'Экспортируемые подпути legacy-пакетов — поверхность кода, а не пользовательская возможность; строка появляется в том блоке, который переносит соответствующий пакет.'
    plan: 'блоки 11–17 по владельцу пакета'
  - selector: 'app'
    count: 6
    reason: 'Приложения — host-профили, а не возможности; их строки описаны профилями продукта.'
    plan: 'срез 3 блока 10 (product-profiles)'
  - selector: 'app-route'
